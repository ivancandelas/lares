# Pack de jurisdicción: México / Jalisco, año fiscal 2026
#
# Las reglas que cambian por país, estado y año NO son código. Son datos
# versionados y compartibles. Ver docs/03-module-system.md#packs-de-jurisdicción
#
# Estado: borrador. Las reglas de vehículos viven todavía en
# modules/vehicles/obligations.py; migrarlas aquí es trabajo de F3 (OBL-08).

meta:
  id: mx-jalisco
  label: México — Jalisco
  jurisdiction: MX-JAL
  year: 2026
  currency: MXN

rules:
  - id: refrendo_vehicular
    label: Refrendo vehicular
    applies_to: vehicle
    schedule: {yearly: {month: 3, day: 31}}
    remind: [-60, -30, -7]
    severity: high
    note: Suele haber descuento por pago anticipado.

  - id: verificacion_vehicular
    label: Verificación vehicular
    applies_to: vehicle
    schedule: {semiannual_by: last_plate_digit}
    remind: [-45, -20, -7, -1]
    severity: high

  - id: predial
    label: Impuesto predial
    applies_to: property
    schedule: {yearly: {month: 1, day: 31}}
    remind: [-45, -15, -3]
    severity: high
    note: Descuento por pago anual anticipado en enero.

  - id: licencia_conducir
    label: Renovación de licencia de conducir
    applies_to: document
    match: {doc_type: drivers_license}
    schedule: {on_expiry: true}
    remind: [-90, -30, -7]
    severity: normal

  - id: pasaporte
    label: Renovación de pasaporte
    applies_to: document
    match: {doc_type: passport}
    schedule: {on_expiry: true}
    # Muchos países exigen 6 meses de vigencia al viajar.
    remind: [-270, -180, -90, -30]
    severity: normal
