name: lares

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lares
      POSTGRES_PASSWORD: lares
      POSTGRES_DB: lares
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lares"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      LARES_DATABASE_URL: postgres://lares:lares@db:5432/lares
      LARES_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./src:/app/src
      - media_data:/data/media
    ports:
      - "8000:8000"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build: .
    command: celery -A lares.celery worker -l info --workdir src
    env_file: .env
    environment:
      LARES_DATABASE_URL: postgres://lares:lares@db:5432/lares
      LARES_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./src:/app/src
      - media_data:/data/media
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  beat:
    build: .
    command: celery -A lares.celery beat -l info --workdir src
    env_file: .env
    environment:
      LARES_DATABASE_URL: postgres://lares:lares@db:5432/lares
      LARES_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./src:/app/src
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  db_data:
  media_data:
