# Despliegue de Lares en casa.
#
# Se diferencia del compose de desarrollo en tres cosas, y las tres importan:
#
#   - usa una **imagen publicada y etiquetada**, no construye en el destino;
#   - no monta el código desde el disco, así que lo que corre es lo que dice
#     la etiqueta y nada más;
#   - se reinicia solo, porque un servidor de casa se apaga cuando se va la luz.
#
#   docker compose -f compose.prod.yaml up -d
#
# Y para actualizar:  make update

name: lares

x-app: &app
  image: ${LARES_IMAGE:-ghcr.io/ivancandelas/lares}:${LARES_TAG:-latest}
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: lares.settings.prod
    LARES_DATABASE_URL: postgres://lares:${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}@db:5432/lares
    LARES_REDIS_URL: redis://redis:6379/0
    LARES_MEDIA_ROOT: /data/media
  volumes:
    - media_data:/data/media
  restart: unless-stopped
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lares
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: lares
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lares"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  web:
    <<: *app
    ports:
      - "${LARES_PORT:-8000}:8000"

  worker:
    <<: *app
    command: celery -A lares.celery worker -l info
    # Solo la web migra y recoge estáticos: tres procesos haciendo lo mismo al
    # arrancar es una carrera que no hace falta correr. El candado del
    # entrypoint la evitaría igual, pero esto además arranca antes.
    environment:
      DJANGO_SETTINGS_MODULE: lares.settings.prod
      LARES_DATABASE_URL: postgres://lares:${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}@db:5432/lares
      LARES_REDIS_URL: redis://redis:6379/0
      LARES_MEDIA_ROOT: /data/media
      LARES_MIGRATE_ON_START: "0"
      LARES_COLLECTSTATIC: "0"
    healthcheck:
      test: ["CMD-SHELL", "celery -A lares.celery inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s

  beat:
    <<: *app
    command: celery -A lares.celery beat -l info
    # El healthcheck de la imagen pregunta por HTTP y aquí no hay HTTP: sin
    # esto, el reloj sale "enfermo" para siempre y nadie se fía del panel.
    healthcheck:
      disable: true
    environment:
      DJANGO_SETTINGS_MODULE: lares.settings.prod
      LARES_DATABASE_URL: postgres://lares:${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}@db:5432/lares
      LARES_REDIS_URL: redis://redis:6379/0
      LARES_MIGRATE_ON_START: "0"
      LARES_COLLECTSTATIC: "0"

volumes:
  db_data:
  media_data:
  redis_data:
