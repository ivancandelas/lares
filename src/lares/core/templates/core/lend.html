{% extends "base.html" %}
{% block title %}Prestar - {{ product_name }}{% endblock %}

{% block content %}
<div class="max-w-sm">
  <h1 class="text-2xl font-light tracking-tight">Prestar {{ obj }}</h1>
  <p class="mt-1 text-sm text-soft">Para que dentro de un año sepas dónde está.</p>

  <form method="post" class="mt-8 space-y-5">
    {% csrf_token %}
    <label class="block">
      <span class="text-sm text-soft">¿A quién?</span>
      <select name="party" required
              class="mt-1 w-full rounded-sm border border-rule bg-white px-3 py-2 focus:border-calm focus:outline-none">
        {% for p in personas %}<option value="{{ p.pk }}">{{ p.name }}</option>{% endfor %}
      </select>
    </label>
    <div class="flex items-center gap-4">
      <button class="rounded-sm bg-calm px-4 py-2.5 text-sm font-medium text-white hover:bg-ink">Prestar</button>
      <a href="{% url 'core:resource-detail' obj.pk %}" class="text-sm text-soft hover:text-ink">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
