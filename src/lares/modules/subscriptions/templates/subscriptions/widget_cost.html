{% load money %}
<div class="mt-2 text-[13px] text-soft">
  {{ total }} activa{{ total|pluralize }}, {% money0 anual %} al año
</div>
<ul class="mt-2 space-y-1.5">
  {% for s in subs %}
    <li class="flex items-baseline justify-between gap-3 text-[14px]">
      <span class="min-w-0 truncate">{{ s.name }}</span>
      <span class="shrink-0 tabular-nums text-[13px] text-soft">{% money0 s.yearly_cost s.currency %}</span>
    </li>
  {% empty %}
    <li class="text-[14px] text-soft">Nada registrado.</li>
  {% endfor %}
</ul>
