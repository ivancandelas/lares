<ul class="mt-2 space-y-1.5">
  {% for o in obligations %}
    <li class="flex items-baseline justify-between gap-3 text-[14px]">
      <span class="min-w-0 truncate">{{ o.title }}</span>
      <span class="shrink-0 text-[13px] text-soft">{{ o.due_on|date:"j M"|lower }}</span>
    </li>
  {% empty %}
    <li class="text-[14px] text-soft">Nada en los próximos meses.</li>
  {% endfor %}
</ul>
