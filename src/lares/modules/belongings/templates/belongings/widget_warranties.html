<ul class="mt-2 space-y-1.5">
  {% for b in items %}
    <li class="flex items-baseline justify-between gap-3 text-[14px]">
      <span class="min-w-0 truncate">{{ b.name }}</span>
      <span class="shrink-0 text-[13px] text-soft">{{ b.warranty_until|date:"j M"|lower }}</span>
    </li>
  {% empty %}
    <li class="text-[14px] text-soft">Ninguna vence en los próximos seis meses.</li>
  {% endfor %}
</ul>
