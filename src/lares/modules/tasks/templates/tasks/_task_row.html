<li class="flex items-baseline justify-between gap-4 py-3">
  <div class="min-w-0">
    <div class="text-[15px] leading-snug">
      {% if t.priority == 'high' %}<span class="text-soon" title="Prioridad alta">▲</span> {% endif %}{{ t.title }}
    </div>
    {% if t.due_on %}
      <div class="text-[13px] {% if late %}text-overdue{% else %}text-soft{% endif %}">
        {{ t.due_on|date:"j \d\e F"|lower }}{% if t.assigned_to %}, {{ t.assigned_to }}{% endif %}
      </div>
    {% endif %}
  </div>
  <form method="post" action="{% url 'tasks:complete' t.pk %}" class="shrink-0">
    {% csrf_token %}
    <button class="rounded-sm border border-rule px-2.5 py-1 text-[13px] text-soft
                   hover:border-calm hover:text-calm">Hecha</button>
  </form>
</li>
