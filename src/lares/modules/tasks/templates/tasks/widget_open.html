<ul class="mt-2 space-y-1.5">
  {% for t in tasks %}
    <li class="flex items-baseline justify-between gap-3 text-[14px]">
      <span class="min-w-0 truncate">{{ t.title }}</span>
      {% if t.due_on %}<span class="shrink-0 text-[13px] text-soft">{{ t.due_on|date:"j M"|lower }}</span>{% endif %}
    </li>
  {% empty %}
    <li class="text-[14px] text-soft">Nada apuntado.</li>
  {% endfor %}
</ul>
