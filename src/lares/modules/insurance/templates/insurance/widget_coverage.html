<ul class="mt-2 space-y-1.5">
  {% for p in policies %}
    <li class="flex items-baseline justify-between gap-3 text-[14px]">
      <span class="min-w-0 truncate">{{ p.name }}</span>
      {% if p.ends_on %}
        <span class="shrink-0 text-[13px] text-soft">hasta {{ p.ends_on|date:"j M"|lower }}</span>
      {% endif %}
    </li>
  {% empty %}
    <li class="text-[14px] text-soft">Ninguna registrada.</li>
  {% endfor %}
</ul>
