{% load money %}
<div class="mt-2 text-[13px] text-soft">
  Te deben {% money0 por_cobrar %} · Debes {% money0 por_pagar %}
</div>
<ul class="mt-2 space-y-1.5">
  {% for l in loans %}
    <li class="flex items-baseline justify-between gap-3 text-[14px]">
      <span class="min-w-0 truncate">{{ l.name }}</span>
      <span class="shrink-0 tabular-nums text-[13px] text-soft">{% money0 l.outstanding l.currency %}</span>
    </li>
  {% empty %}
    <li class="text-[14px] text-soft">Ninguno registrado.</li>
  {% endfor %}
</ul>
