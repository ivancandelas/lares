# Publica la imagen cuando se empuja una etiqueta v*.
#
# La imagen se construye aquí y no en el servidor de casa: actualizar tiene que
# ser bajar algo ya construido y probado, no compilar a las once de la noche en
# la máquina donde vives.

name: Publicar la imagen

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lares
          POSTGRES_PASSWORD: lares
          POSTGRES_DB: lares
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lares"
          --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - name: Pasar la batería
        env:
          LARES_DATABASE_URL: postgres://lares:lares@127.0.0.1:5432/lares
        # Una imagen que no pasa las pruebas no se publica: quien la baje la
        # va a instalar en su casa.
        run: uv run pytest -q --ignore=tests/test_browser.py

  imagen:
    needs: pruebas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que la etiqueta y el archivo VERSION coinciden
        # Si no coinciden, la imagen diría una versión y la etiqueta otra, y
        # entonces «qué versión corre» deja de tener respuesta.
        run: |
          ARCHIVO="$(cat VERSION)"
          ETIQUETA="${GITHUB_REF_NAME#v}"
          test "$ARCHIVO" = "$ETIQUETA" || {
            echo "VERSION dice $ARCHIVO y la etiqueta es $ETIQUETA" >&2
            exit 1
          }

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: LARES_VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
